# 此文件仅用于本机测试；Web 面板的 OneNav 示例默认使用 [::]:9632 接收外网连接。
# [::1] 只允许本机访问；需要外网 IPv6 入口时将对应 listen 改为 [::]:端口。
connect_timeout = 5.0

# IPv6 入口 → IPv4 服务，同时改写端口
[[rules]]
listen = "[::1]:19632"
target = "127.0.0.1:9632"

# IPv4 入口 → IPv6 服务，同时改写端口
[[rules]]
listen = "127.0.0.1:19633"
target = "[::1]:9633"
